name: ts-auth-service
port: 12340
namespace: tt-mysql

image:
  registry: ghcr.io/passw0rd404
  tag: latest

env:
  SPRING_MAIN_ALLOW_CIRCULAR_REFERENCES: "true"

resources:
  requests:
    cpu: 100m
    memory: 300Mi
  limits:
    cpu: 500m
    memory: 2000Mi

mysql:
  enabled: true
  externalSecret:
    store:
      kind: ClusterSecretStore
      name: ts-mysql
    key: production/mysql

networkPolicy:
  enabled: true
  allowFrom:
    - name: traefik
      namespace: traefik
    - name: ts-user-service
      namespace: tt-mysql

httpRoute:
  enabled: true
  paths:
    - value: /api/v1/auth
    - value: /api/v1/users
