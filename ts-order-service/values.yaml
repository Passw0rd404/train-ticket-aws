name: ts-order-service
port: 12031
namespace: tt-mysql

image:
  registry: ghcr.io/passw0rd404
  tag: sha-2b2f880

env:
  SPRING_MAIN_ALLOW_CIRCULAR_REFERENCES: "true"

resources:
  requests:
    cpu: 100m
    memory: 300Mi
  limits:
    cpu: 500m
    memory: 2000Mi

mysql:
  enabled: true
  externalSecret:
    store:
      kind: ClusterSecretStore
      name: ts-mysql
    key: production/mysql

networkPolicy:
  enabled: true
  allowFrom:
    - name: ts-admin-order-service
      namespace: tt-no-secrets
    - name: ts-cancel-service
      namespace: tt-no-secrets
    - name: ts-execute-service
      namespace: tt-no-secrets
    - name: traefik
      namespace: traefik
    - name: ts-inside-payment-service
      namespace: tt-mysql
    - name: ts-preserve-service
      namespace: tt-no-secrets
    - name: ts-rebook-service
      namespace: tt-no-secrets
    - name: ts-seat-service
      namespace: tt-no-secrets
    - name: ts-security-service
      namespace: tt-mysql
    - name: ts-voucher-service
      namespace: tt-mysql

httpRoute:
  enabled: true
  paths:
    - value: /api/v1/orderservice
