name: ts-seat-service
port: 18898
namespace: tt-no-secrets

image:
  registry: ghcr.io/passw0rd404
  tag: latest

env:
  SPRING_MAIN_ALLOW_CIRCULAR_REFERENCES: "true"

resources:
  requests:
    cpu: 100m
    memory: 300Mi
  limits:
    cpu: 500m
    memory: 2000Mi

networkPolicy:
  enabled: true
  allowFrom:
    - name: traefik
      namespace: traefik
    - name: ts-preserve-other-service
      namespace: tt-no-secrets
    - name: ts-preserve-service
      namespace: tt-no-secrets
    - name: ts-rebook-service
      namespace: tt-no-secrets
    - name: ts-travel-plan-service
      namespace: tt-no-secrets
    - name: ts-travel-service
      namespace: tt-mysql
    - name: ts-travel2-service
      namespace: tt-mysql

httpRoute:
  enabled: true
  paths:
    - value: /api/v1/seatservice
