name: ts-gateway-service
port: 18888
namespace: tt-no-secrets

image:
  registry: ghcr.io/passw0rd404
  tag: latest

env:
  SPRING_MAIN_ALLOW_CIRCULAR_REFERENCES: "true"

resources:
  requests:
    cpu: 100m
    memory: 300Mi
  limits:
    cpu: 500m
    memory: 2000Mi

service:
  type: NodePort
  nodePort: 30467

networkPolicy:
  enabled: true
  externalCidrs:
    - 0.0.0.0/0
