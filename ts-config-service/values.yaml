name: ts-config-service
port: 15679

image:
  registry: ghcr.io/passw0rd404
  tag: latest

env:
  SPRING_MAIN_ALLOW_CIRCULAR_REFERENCES: "true"

resources:
  requests:
    cpu: 100m
    memory: 300Mi
  limits:
    cpu: 500m
    memory: 2000Mi

mysql:
  enabled: true
  externalSecret:
    store:
      kind: ClusterSecretStore
      name: ts-mysql
    key: production/mysql

networkPolicy:
  enabled: true
  allowFrom:
    - name: ts-admin-basic-info-service
      namespace: tt-no-secrets
    - name: ts-gateway-service
      namespace: tt-no-secrets
    - name: ts-seat-service
      namespace: tt-no-secrets
