name: ts-route-service
port: 11178
namespace: tt-mysql

image:
  registry: ghcr.io/passw0rd404
  tag: latest

env:
  SPRING_MAIN_ALLOW_CIRCULAR_REFERENCES: "true"

resources:
  requests:
    cpu: 100m
    memory: 300Mi
  limits:
    cpu: 500m
    memory: 2000Mi

mysql:
  enabled: true
  externalSecret:
    store:
      kind: ClusterSecretStore
      name: ts-mysql
    key: production/mysql

networkPolicy:
  enabled: true
  allowFrom:
    - name: ts-admin-route-service
      namespace: tt-no-secrets
    - name: ts-admin-travel-service
      namespace: tt-no-secrets
    - name: ts-basic-service
      namespace: tt-no-secrets
    - name: traefik
      namespace: traefik
    - name: ts-rebook-service
      namespace: tt-no-secrets
    - name: ts-route-plan-service
      namespace: tt-no-secrets
    - name: ts-travel-service
      namespace: tt-mysql
    - name: ts-travel2-service
      namespace: tt-mysql

httpRoute:
  enabled: true
  paths:
    - value: /api/v1/routeservice
