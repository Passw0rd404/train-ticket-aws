name: ts-travel-service
port: 12346
namespace: tt-mysql

image:
  registry: ghcr.io/passw0rd404
  tag: sha-2b2f880

env:
  SPRING_MAIN_ALLOW_CIRCULAR_REFERENCES: "true"

resources:
  requests:
    cpu: 100m
    memory: 300Mi
  limits:
    cpu: 500m
    memory: 2000Mi

mysql:
  enabled: true
  externalSecret:
    store:
      kind: ClusterSecretStore
      name: ts-mysql
    key: production/mysql

networkPolicy:
  enabled: true
  allowFrom:
    - name: ts-admin-travel-service
      namespace: tt-no-secrets
    - name: ts-food-service
      namespace: tt-mysql-rabbitmq
    - name: traefik
      namespace: traefik
    - name: ts-preserve-service
      namespace: tt-no-secrets
    - name: ts-rebook-service
      namespace: tt-no-secrets
    - name: ts-route-plan-service
      namespace: tt-no-secrets
    - name: ts-travel-plan-service
      namespace: tt-no-secrets

httpRoute:
  enabled: true
  paths:
    - value: /api/v1/travelservice
