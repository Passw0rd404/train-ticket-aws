name: ts-notification-service
port: 17853
namespace: tt-notification

image:
  registry: ghcr.io/passw0rd404
  tag: sha-2b2f880

env:
  SPRING_MAIN_ALLOW_CIRCULAR_REFERENCES: "true"

resources:
  requests:
    cpu: 100m
    memory: 300Mi
  limits:
    cpu: 500m
    memory: 2000Mi

mysql:
  enabled: true
  externalSecret:
    store:
      kind: ClusterSecretStore
      name: ts-mysql
    key: production/mysql

externalSecrets:
  email:
    store:
      kind: ClusterSecretStore
      name: ts-email
    key: production/notification-email
    data:
      - secretKey: email_address
        property: address
      - secretKey: email_password
        property: password

networkPolicy:
  enabled: true
  allowFrom:
    - name: ts-cancel-service
      namespace: tt-no-secrets
    - name: traefik
      namespace: traefik

httpRoute:
  enabled: true
  paths:
    - value: /api/v1/notifyservice
