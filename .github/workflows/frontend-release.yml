name: Frontend - Release (Cloudflare Pages)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-deploy
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check SITE_URL is set
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::error::Set the SITE_URL repository variable (for example https://example.com)."
            exit 1
          fi

      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Check frontend files
        run: test -f ts-ui-dashboard/static/index.html

      # The stamp lets the last step confirm the new build is really being served
      - name: Stamp version
        id: stamp
        run: |
          SHA=$(git rev-parse HEAD)
          echo "$SHA" > ts-ui-dashboard/static/version.txt
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy ts-ui-dashboard/static
            --project-name=${{ vars.CF_PAGES_PROJECT }}
            --branch=main
            --commit-hash=${{ steps.stamp.outputs.sha }}
            --commit-dirty=true

      - name: Verify the new version is live
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          EXPECTED: ${{ steps.stamp.outputs.sha }}
        run: |
          SITE_URL="${SITE_URL%/}"
          LIVE=""
          for _ in $(seq 1 60); do
            LIVE=$(curl -fsS -H "Cache-Control: no-cache" "$SITE_URL/version.txt?t=$(date +%s)" 2>/dev/null | tr -d '[:space:]' || true)
            if [ "$LIVE" = "$EXPECTED" ]; then
              echo "Live version is now $EXPECTED"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Site did not report $EXPECTED within 300s (last saw: '${LIVE:-nothing}')"
          exit 1
