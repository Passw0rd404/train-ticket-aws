name: Frontend - Release (S3 + CloudFront)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: frontend-release
  cancel-in-progress: false

env:
  VERSION: ${{ github.sha }}
  FRONTEND_DIR: ts-ui-dashboard/static
  # Set these in Settings -> Secrets and variables -> Actions -> Variables
  FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET }}
  ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }} # optional backup bucket
  KVS_ARN: ${{ vars.KVS_ARN }}
  SITE_URL: ${{ vars.SITE_URL }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The UI is plain static files (HTML, CSS, JS): there is nothing to build.
      - name: Check frontend files
        run: test -f "$FRONTEND_DIR/index.html"

      # Lets the switch step confirm the new build is really being served
      - name: Stamp version
        run: echo "$VERSION" > "$FRONTEND_DIR/version.txt"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/gha-frontend-release
          aws-region: ${{ vars.AWS_REGION }}

      # Backup first: if anything below fails, the release is still recoverable
      - name: Archive build to artifacts bucket
        if: env.ARTIFACTS_BUCKET != ''
        run: |
          tar -czf frontend-artifact.tar.gz -C "$FRONTEND_DIR" .
          aws s3 cp frontend-artifact.tar.gz \
            "s3://$ARTIFACTS_BUCKET/frontend/frontend-$VERSION.tar.gz"

      - name: Upload to versioned prefix
        # Keep each build immutable so the active version can be switched or
        # rolled back without redeploying anything.
        run: bash .github/scripts/upload-frontend.sh "$FRONTEND_DIR" "$FRONTEND_BUCKET" "$VERSION"

      - name: Switch live version
        # The CloudFront function reads this pointer to select the active build.
        run: bash .github/scripts/switch-frontend.sh "$VERSION"
