name: Build & Push Images

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths-ignore:
      - 'ts-*/values.yaml'
      - 'deployment/**'
      - 'functions/**'
      - 'ts-ui-dashboard/**'
      - '*.md'
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-push-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # Change to "linux/amd64,linux/arm64" if your cluster has ARM nodes
  PLATFORMS: linux/amd64
  # Java images: "0" = show findings but never block the push,
  # "1" = block the push on fixable HIGH/CRITICAL findings.
  # Start at "0" (legacy Java 8 stack) and flip to "1" once the findings are clean.
  JAVA_TRIVY_EXIT_CODE: "0"

# Pull requests only BUILD and SCAN (validation). Pushes to main and v* tags
# BUILD, SCAN, PUSH, then SIGN and attach SBOM + provenance.
# Images: ghcr.io/<owner>/<service>:{latest, sha-xxxxxxx, 1.2.3, 1.2}

jobs:
  # ---------------------------------------------------------------------------
  # Find every service that has a Dockerfile, split by how it is built
  # ---------------------------------------------------------------------------
  discover:
    name: Discover services
    runs-on: ubuntu-latest
    outputs:
      java: ${{ steps.find.outputs.java }}
      other: ${{ steps.find.outputs.other }}
      prefix: ${{ steps.find.outputs.prefix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Find services
        id: find
        run: |
          set -euo pipefail
          java=$(for d in ts-*/; do d=${d%/}; if [ -f "$d/Dockerfile" ] && [ -f "$d/pom.xml" ]; then echo "$d"; fi; done | jq -R . | jq -sc .)
          other=$(for d in ts-*/; do d=${d%/};    if [ -f "$d/Dockerfile" ] && [ ! -f "$d/pom.xml" ] && [ "$d" != "ts-ui-dashboard" ]; then echo "$d"; fi; done | jq -R . | jq -sc .)
          {
            echo "java=$java"
            echo "other=$other"
            echo "prefix=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}"
          } >> "$GITHUB_OUTPUT"
          echo "Java services:  $java"
          echo "Other services: $other"

  # ---------------------------------------------------------------------------
  # Java runtime base image (docker/java-runtime): built, scanned, pushed and
  # signed once. The Java jobs below pull it by digest. Pull requests only build
  # and scan it, and the Java jobs then build the base image themselves.
  # ---------------------------------------------------------------------------
  runtime:
    name: java runtime base image
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    env:
      IMAGE: ${{ needs.discover.outputs.prefix }}/train-ticket-java-runtime
      TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
      TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=pr
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      # 1. Build once into the local Docker daemon, for scanning
      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: docker/java-runtime
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          sbom: false
          tags: scan/java-runtime:ci
          cache-from: type=gha,scope=java-runtime
          cache-to: type=gha,mode=max,scope=java-runtime

      # 2. Security gate (blocking only when JAVA_TRIVY_EXIT_CODE is "1")
      - name: Trivy gate (vulnerabilities and secrets)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan/java-runtime:ci
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: ${{ env.JAVA_TRIVY_EXIT_CODE }}
          format: table

      - name: Trivy report (SARIF)
        if: always() && github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan/java-runtime:ci
          scanners: vuln
          format: sarif
          output: trivy.sarif
          exit-code: "0"

      - name: Upload Trivy report
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          sarif_file: trivy.sarif
          category: trivy-java-runtime

      # 3. Push (layers come from the cache, so this is fast)
      - name: Push image
        id: build
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: docker/java-runtime
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=java-runtime

      # 4. SBOM, provenance and signature, as for every other image
      - name: Generate SBOM (SPDX)
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@v0
        env:
          SYFT_FILE_METADATA_SELECTION: none
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom-java-runtime.spdx.json

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Sign image and attest SBOM
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          retry() { n=$1; shift; for i in $(seq 1 "$n"); do "$@" && return 0; echo "attempt $i of $n failed"; sleep $((i*15)); done; return 1; }
          retry 4 cosign sign --yes "${IMAGE}@${DIGEST}"
          ls -l sbom.spdx.json
          retry 2 cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${IMAGE}@${DIGEST}" || {
            echo "::warning::Rekor refused the SBOM attestation; attaching it without a transparency log entry"
            cosign attest --yes --tlog-upload=false --type spdxjson --predicate sbom.spdx.json "${IMAGE}@${DIGEST}"
          }

      # The Java jobs build their images FROM this exact digest
      - name: Export image reference
        id: ref
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "image=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Java services: Maven builds the jar, then Docker packages it.
  # The Dockerfiles expect a pre-built Java runtime base image, so each job
  # builds docker/java-runtime locally and passes it in as JAVA_RUNTIME_IMAGE
  # (the "docker" buildx driver is required so FROM can see a local image).
  # Flow: build locally -> Trivy -> push -> SBOM -> provenance -> sign.
  # The push step rebuilds from the local layer cache, so it is fast.
  # ---------------------------------------------------------------------------
  java:
    name: java / ${{ matrix.service }}
    needs: [discover, runtime]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        service: ${{ fromJSON(needs.discover.outputs.java) }}
    env:
      IMAGE: ${{ needs.discover.outputs.prefix }}/${{ matrix.service }}
      # Our runtime image by digest; on pull requests (nothing is pushed) the base is built locally
      JAVA_RUNTIME_IMAGE: ${{ needs.runtime.outputs.image || 'train-ticket-java-runtime:local' }}
      # 40+ parallel scans can hit the rate limit of one vulnerability database
      # registry, so a second mirror is listed as a fallback.
      TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
      TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Temurin first; if its download is broken (it returned a bad archive for some jobs),
      # fall back to Zulu, which is hosted elsewhere. setup-java also caches ~/.m2.
      - name: Set up JDK 8 (Temurin)
        id: jdk
        continue-on-error: true
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Set up JDK 8 (Zulu, fallback)
        if: steps.jdk.outcome == 'failure'
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "8"
          cache: maven

      # Maven Central answers 429 when many jobs download at once, so retry with a pause.
      # -U on a retry makes Maven forget the failures it cached from the first attempt.
      - name: Maven package (tests skipped)
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          for i in 1 2 3 4 5; do
            U=""; [ "$i" -gt 1 ] && U="-U"
            if mvn -B -ntp $U -Dmaven.wagon.http.retryHandler.count=5 \
                 -pl "$SERVICE" -am package -Dmaven.test.skip=true; then
              exit 0
            fi
            echo "Maven failed (attempt $i of 5), waiting before the next try"
            sleep $((i * 30))
          done
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Build Java runtime base image
        if: needs.runtime.outputs.image == ''
        uses: docker/build-push-action@v7
        with:
          context: docker/java-runtime
          push: false
          load: true
          provenance: false
          sbom: false
          tags: train-ticket-java-runtime:local

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=pr
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      # 1. Build once into the local Docker daemon, for scanning
      - name: Build image for scanning
        id: scan
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          push: false
          load: true
          provenance: false
          sbom: false
          tags: scan/${{ matrix.service }}:ci
          build-args: |
            JAVA_RUNTIME_IMAGE=${{ env.JAVA_RUNTIME_IMAGE }}

      # 2. Security gate (blocking only when JAVA_TRIVY_EXIT_CODE is "1")
      - name: Trivy gate (vulnerabilities and secrets)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan/${{ matrix.service }}:ci
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: ${{ env.JAVA_TRIVY_EXIT_CODE }}
          format: table

      # Full report in the Security tab (never blocks)
      - name: Trivy report (SARIF)
        if: always() && github.event_name != 'pull_request' && steps.scan.outcome == 'success'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan/${{ matrix.service }}:ci
          scanners: vuln
          format: sarif
          output: trivy.sarif
          exit-code: "0"

      - name: Upload Trivy report
        if: always() && github.event_name != 'pull_request' && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.service }}

      # 3. Push (layers come from the local cache, so this is fast)
      - name: Push image
        id: build
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            JAVA_RUNTIME_IMAGE=${{ env.JAVA_RUNTIME_IMAGE }}

      # 4. SBOM from the pushed digest
      - name: Generate SBOM (SPDX)
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@v0
        env:
          SYFT_FILE_METADATA_SELECTION: none
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom-${{ matrix.service }}.spdx.json

      # 5. SLSA build provenance, stored in the registry next to the image
      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # 6. Sign the image and attach the SBOM as a signed attestation
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Sign image and attest SBOM
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          retry() { n=$1; shift; for i in $(seq 1 "$n"); do "$@" && return 0; echo "attempt $i of $n failed"; sleep $((i*15)); done; return 1; }
          retry 4 cosign sign --yes "${IMAGE}@${DIGEST}"
          ls -l sbom.spdx.json
          retry 2 cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${IMAGE}@${DIGEST}" || {
            echo "::warning::Rekor refused the SBOM attestation; attaching it without a transparency log entry"
            cosign attest --yes --tlog-upload=false --type spdxjson --predicate sbom.spdx.json "${IMAGE}@${DIGEST}"
          }

  # ---------------------------------------------------------------------------
  # Non-Java services (Python, Node, Go): each Dockerfile is self-contained.
  # Flow: build locally -> Trivy gate -> push -> SBOM -> provenance -> sign.
  # Nothing is pushed unless the Trivy gate passes.
  # ---------------------------------------------------------------------------
  other:
    name: other / ${{ matrix.service }}
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.discover.outputs.other) }}
    env:
      IMAGE: ${{ needs.discover.outputs.prefix }}/${{ matrix.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=pr
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      # 1. Build once into the local Docker daemon, for scanning
      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          sbom: false
          tags: scan/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # 2. Security gate: fail on fixable HIGH/CRITICAL vulnerabilities or secrets
      - name: Trivy gate (vulnerabilities and secrets)
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan/${{ matrix.service }}:ci
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table

      # Full report in the Security tab (never blocks)
      - name: Trivy report (SARIF)
        if: always() && github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan/${{ matrix.service }}:ci
          scanners: vuln
          format: sarif
          output: trivy.sarif
          exit-code: "0"

      - name: Upload Trivy report
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.service }}

      # 3. Push (layers come from the cache, so this is fast)
      - name: Push image
        id: build
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}

      # 4. SBOM from the pushed digest
      - name: Generate SBOM (SPDX)
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@v0
        env:
          SYFT_FILE_METADATA_SELECTION: none
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom-${{ matrix.service }}.spdx.json

      # 5. SLSA build provenance, stored in the registry next to the image
      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # 6. Sign the image and attach the SBOM as a signed attestation
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Sign image and attest SBOM
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          retry() { n=$1; shift; for i in $(seq 1 "$n"); do "$@" && return 0; echo "attempt $i of $n failed"; sleep $((i*15)); done; return 1; }
          retry 4 cosign sign --yes "${IMAGE}@${DIGEST}"
          ls -l sbom.spdx.json
          retry 2 cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${IMAGE}@${DIGEST}" || {
            echo "::warning::Rekor refused the SBOM attestation; attaching it without a transparency log entry"
            cosign attest --yes --tlog-upload=false --type spdxjson --predicate sbom.spdx.json "${IMAGE}@${DIGEST}"
          }

  # ---------------------------------------------------------------------------
  # Commit the newly pushed sha-<short> image tag to ts-*/values.yaml on main
  # so Argo CD automatically rolls out verified images.
  # ---------------------------------------------------------------------------
  update-values:
    name: Update Helm image tags
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [java, other]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Update tag in ts-*/values.yaml
        run: |
          SHORT_TAG="sha-${GITHUB_SHA:0:7}"
          python3 - "$SHORT_TAG" <<'PY'
          import re, sys
          from pathlib import Path

          tag = sys.argv[1]
          for f in sorted(Path(".").glob("ts-*/values.yaml")):
              text = f.read_text(encoding="utf-8")
              updated = re.sub(
                  r'(^image:\s*\n(?:[ \t]+.*\n)*?[ \t]+tag:\s*).*$',
                  rf'\g<1>{tag}',
                  text,
                  flags=re.M,
              )
              if updated != text:
                  f.write_text(updated, encoding="utf-8")
                  print(f"Updated {f} -> {tag}")
          PY

      - name: Commit and push updated values
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- 'ts-*/values.yaml'; then
            echo "No values.yaml changes."
            exit 0
          fi
          git add ts-*/values.yaml
          git commit -m "chore(gitops): bump service image tags to sha-${GITHUB_SHA:0:7} [skip ci]"
          git pull --rebase origin main
          git push origin main

  # ---------------------------------------------------------------------------
  # Single check to require in branch protection (matrix job names are dynamic)
  # ---------------------------------------------------------------------------
  build-status:
    name: Build status
    needs: [runtime, java, other, update-values]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any image failed
        env:
          RUNTIME: ${{ needs.runtime.result }}
          JAVA: ${{ needs.java.result }}
          OTHER: ${{ needs.other.result }}
          UPDATE: ${{ needs.update-values.result }}
        run: |
          echo "runtime=$RUNTIME java=$JAVA other=$OTHER update=$UPDATE"
          if [ "$RUNTIME" != "success" ] || [ "$JAVA" != "success" ] || [ "$OTHER" != "success" ] || { [ "$UPDATE" != "success" ] && [ "$UPDATE" != "skipped" ]; }; then
            echo "One or more image builds failed."
            exit 1
          fi
