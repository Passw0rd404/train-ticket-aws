name: Terraform apply

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Never let two applies touch the same state at once.
concurrency:
  group: terraform-dev
  cancel-in-progress: false

env:
  TF_VERSION: '1.11.0'
  # Whole tree (the stack and the modules), used by fmt and the linters
  INFRA_DIR: './deployment/infra'
  # The only environment
  WORKING_DIR: './deployment/infra/dev'
  AWS_REGION: 'eu-central-1'
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_grafana_cloud_access_policy_token: ${{ secrets.GRAFANA_CLOUD_ACCESS_POLICY_TOKEN }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/gha-terraform
          role-duration-seconds: 7200
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Format
        run: terraform fmt -recursive
        working-directory: ${{ env.INFRA_DIR }}

      - name: Terraform Init
        run: terraform init -input=false -backend-config="bucket=tfstate-mern-dev-${{ vars.AWS_ACCOUNT_ID }}"
        working-directory: ${{ env.WORKING_DIR }}

      - name: Terraform Validate
        run: terraform validate -no-color
        working-directory: ${{ env.WORKING_DIR }}

      - name: TFLint Setup
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest

      - name: TFLint
        run: |
          tflint --init
          tflint --recursive -f compact
        working-directory: ${{ env.INFRA_DIR }}
        continue-on-error: true

      - name: Checkov Security Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ env.INFRA_DIR }}
          framework: terraform
          output_format: cli
          soft_fail: true

      - name: Terraform Plan
        run: |
          set -o pipefail
          terraform plan -no-color -input=false -lock-timeout=5m -out=tfplan 2>&1 | tee plan.log \
            || { echo "=== ERRORS ==="; grep -n -B2 -A10 'Error:' plan.log; exit 1; }
        working-directory: ${{ env.WORKING_DIR }}

      - name: Terraform Apply
        run: |
          set -o pipefail
          terraform apply -no-color -input=false -lock-timeout=5m tfplan 2>&1 | tee apply.log
        working-directory: ${{ env.WORKING_DIR }}

      - name: Build checklist
        if: always()
        run: |
          LOG="${{ env.WORKING_DIR }}/apply.log"
          [ -f "$LOG" ] || exit 0
          {
            echo "## Apply checklist"
            echo "| Resource | Action | Result |"
            echo "|---|---|---|"
            grep -E ': (Creation|Modifications|Destruction) complete after' "$LOG" \
              | sed -E 's/^([^:]+): (Creation|Modifications|Destruction) complete after.*/| \1 | \2 | ✅ |/'
            awk '/Error: /{m=$0; sub(/^.*Error: /,"",m); gsub(/\|/,"/",m); m=substr(m,1,150)}
                 /^[│ ]*with /{a=$0; sub(/^[│ ]*with /,"",a); sub(/,$/,"",a); printf "| %s | %s | ❌ |\n", a, m}' "$LOG"
          } >> "$GITHUB_STEP_SUMMARY"
