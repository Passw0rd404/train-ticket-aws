name: Terraform destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy-dev" to confirm'
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-dev
  cancel-in-progress: false

env:
  TF_VERSION: '1.11.0'
  WORKING_DIR: './deployment/infra/dev'
  AWS_REGION: 'eu-central-1'
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_grafana_cloud_access_policy_token: ${{ secrets.GRAFANA_CLOUD_ACCESS_POLICY_TOKEN }}

jobs:
  destroy:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          # Require an explicit phrase because this workflow permanently
          # removes the environment.
          if [ "$CONFIRM" != "destroy-dev" ]; then
            echo "Confirmation text did not match. Nothing was destroyed."
            exit 1
          fi

      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/gha-terraform
          role-duration-seconds: 7200
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -input=false -backend-config="bucket=tfstate-mern-dev-${{ vars.AWS_ACCOUNT_ID }}"
        working-directory: ${{ env.WORKING_DIR }}

      - name: Terminate Karpenter-provisioned EC2 instances
        run: |
          IDS=$(aws ec2 describe-instances \
            --filters "Name=tag:eks:eks-cluster-name,Values=train-ticket-dev" \
                      "Name=tag-key,Values=karpenter.sh/nodepool" \
                      "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query "Reservations[].Instances[].InstanceId" --output text)
          if [ -n "$IDS" ]; then
            echo "Terminating Karpenter EC2 instances: $IDS"
            aws ec2 terminate-instances --instance-ids $IDS
            aws ec2 wait instance-terminated --instance-ids $IDS
          else
            echo "No Karpenter EC2 instances running."
          fi

      - name: Terraform Destroy
        run: terraform destroy -auto-approve -input=false -lock-timeout=5m
        working-directory: ${{ env.WORKING_DIR }}
