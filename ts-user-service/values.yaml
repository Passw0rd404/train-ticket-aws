name: ts-user-service
port: 12342

image:
  registry: ghcr.io/passw0rd404
  tag: latest

env:
  SPRING_MAIN_ALLOW_CIRCULAR_REFERENCES: "true"

resources:
  requests:
    cpu: 100m
    memory: 300Mi
  limits:
    cpu: 500m
    memory: 2000Mi

mysql:
  enabled: true
  externalSecret:
    store:
      kind: ClusterSecretStore
      name: ts-mysql
    key: production/mysql

networkPolicy:
  enabled: true
  allowFrom:
    - name: ts-admin-user-service
      namespace: tt-no-secrets
    - name: ts-cancel-service
      namespace: tt-no-secrets
    - name: ts-gateway-service
      namespace: tt-no-secrets
    - name: ts-preserve-other-service
      namespace: tt-no-secrets
    - name: ts-preserve-service
      namespace: tt-no-secrets
