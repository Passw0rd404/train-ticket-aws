name: ts-news-service
port: 12862
namespace: tt-no-secrets

image:
  registry: ghcr.io/passw0rd404
  tag: latest

resources:
  requests:
    cpu: 100m
    memory: 300Mi
  limits:
    cpu: 500m
    memory: 2000Mi

networkPolicy:
  enabled: true
  allowFrom:
    - name: traefik
      namespace: traefik

httpRoute:
  enabled: true
  paths:
    - value: /api/v1/newsservice
  urlRewrite:
    path:
      type: ReplacePrefixMatch
      replacePrefixMatch: /

readinessProbe:
  type: http
  path: /
livenessProbe:
  type: http
  path: /
