# External Secrets Operator: the upstream chart with our values file from this repo. (wave 1)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.11.0
      helm:
        releaseName: external-secrets
        valueFiles:
          - $values/deployment/charts/external-secrets/values.yaml
    - repoURL: https://github.com/Passw0rd404/train-ticket-aws.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
