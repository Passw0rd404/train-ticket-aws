# Prometheus Node Exporter (host metrics). (wave 1)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: node-exporter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus-node-exporter
      targetRevision: 6.0.0
      helm:
        releaseName: node-exporter
        valueFiles:
          - $values/deployment/charts/monitoring/node-exporter-values.yaml
    - repoURL: https://github.com/Passw0rd404/train-ticket-aws.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
