# Argo Rollouts Gateway API RBAC, ClusterAnalysisTemplate and prom-read ExternalSecrets. (wave 3)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: platform
  source:
    repoURL: https://github.com/Passw0rd404/train-ticket-aws.git
    targetRevision: main
    path: deployment/charts/argo-rollouts/config
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
