# Kyverno CEL policies: Cosign verification, Pod security, Mutation, Generation and Cleanup. (wave 2)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-template
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: platform
  source:
    repoURL: https://github.com/Passw0rd404/train-ticket-aws.git
    targetRevision: main
    path: deployment/charts/kyverno/template
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
