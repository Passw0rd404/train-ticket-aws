# Grafana Alloy Deployment (exporters scrape + OTLP traces + spanmetrics + central relabel filter). (wave 3)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy-collector
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: platform
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.16.0
      helm:
        releaseName: alloy-collector
        valueFiles:
          - $values/deployment/charts/monitoring/alloy-collector-values.yaml
    - repoURL: https://github.com/Passw0rd404/train-ticket-aws.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
