# Kubernetes object state metrics (pods, deployments, rollouts, HPA, jobs). (wave 1)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-state-metrics
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-state-metrics
      targetRevision: 9.1.0
      helm:
        releaseName: kube-state-metrics
        valueFiles:
          - $values/deployment/charts/monitoring/kube-state-metrics-values.yaml
    - repoURL: https://github.com/Passw0rd404/train-ticket-aws.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
