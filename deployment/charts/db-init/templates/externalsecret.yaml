---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mysql-bootstrap
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecret.store.kind }}
    name: {{ .Values.externalSecret.store.name }}
  target:
    name: mysql-bootstrap
    creationPolicy: Owner
  data:
    - secretKey: MYSQL_HOST
      remoteRef:
        key: {{ .Values.externalSecret.key }}
        property: host
    - secretKey: MYSQL_PORT
      remoteRef:
        key: {{ .Values.externalSecret.key }}
        property: port
    - secretKey: MYSQL_DATABASE
      remoteRef:
        key: {{ .Values.externalSecret.key }}
        property: database
    - secretKey: ADMIN_USER
      remoteRef:
        key: {{ .Values.externalSecret.key }}
        property: admin_user
    - secretKey: ADMIN_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecret.key }}
        property: admin_password
    - secretKey: APP_USER
      remoteRef:
        key: {{ .Values.externalSecret.key }}
        property: app_user
    - secretKey: APP_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecret.key }}
        property: app_password
