# Everything that changes from one AWS account / environment to another lives here.
global:
  accountId: "REPLACE_ME"           # AWS account ID, keep the quotes: "123456789012"
  region: eu-central-1              # region where the secrets live in Secrets Manager
  labelDomain: secrets.example.com  # prefix of the namespace labels that unlock a secret store

# One entry per secret type: a ClusterSecretStore that assumes its own scoped IAM role via the
# ESO controller's EKS Pod Identity association.
# Services use `name` as their store name (mysql.externalSecret.store.name, ...).
stores:
  - name: ts-mysql
    roleName: tt-eso-mysql          # IAM role arn:aws:iam::<accountId>:role/<roleName>
    label: mysql                    # namespaces need the label <labelDomain>/mysql: "true"
  - name: ts-rabbitmq
    roleName: tt-eso-rabbitmq
    label: rabbitmq
  - name: ts-email
    roleName: tt-eso-email
    label: email
  - name: cloudflare
    roleName: tt-eso-cloudflare
    label: cloudflare
  - name: monitoring
    roleName: tt-eso-monitoring
    label: monitoring
  - name: grafana-prom-read
    roleName: tt-eso-prom-read
    label: prom-read

# Application namespaces and which secret types each one may use (labels from `stores`).
# Rule: a namespace may use a secret only if EVERY service in it uses that secret.
namespaces:
  - name: tt-mysql-rabbitmq
    secrets: [mysql, rabbitmq, prom-read]
  - name: tt-mysql
    secrets: [mysql, prom-read]
  - name: tt-notification
    secrets: [mysql, email, prom-read]
  - name: tt-no-secrets
    secrets: [prom-read]
  - name: cloudflared
    secrets: [cloudflare]
  - name: monitoring
    secrets: [monitoring]
