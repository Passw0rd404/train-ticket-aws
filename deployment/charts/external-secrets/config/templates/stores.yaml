{{/* One ClusterSecretStore per secret type using EKS Pod Identity on the ESO controller SA
     (external-secrets/external-secrets) + sts:AssumeRole into each scoped role below.
     Each scoped IAM role's trust policy must allow sts:AssumeRole from the ESO controller role,
     and its permissions must allow reading ONLY its own secret. */}}
{{- $acct := required "global.accountId is required" .Values.global.accountId -}}
{{- if not (kindIs "string" $acct) -}}
{{- fail "global.accountId must be a quoted string, for example \"123456789012\"" -}}
{{- end -}}
{{- if eq $acct "REPLACE_ME" -}}
{{- fail "set global.accountId in deployment/charts/external-secrets/config/values.yaml" -}}
{{- end -}}
{{- range .Values.stores }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .name }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ $.Values.global.region }}
      role: arn:aws:iam::{{ $acct }}:role/{{ .roleName }}
  conditions:
    - namespaceSelector:
        matchLabels:
          {{ $.Values.global.labelDomain }}/{{ .label }}: "true"
{{- end }}
