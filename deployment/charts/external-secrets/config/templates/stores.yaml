{{/* One IRSA service account + one ClusterSecretStore per secret type. Each IAM role must be allowed
     to read ONLY its own secret. Trust policy: the cluster's OIDC provider, with
     sub = system:serviceaccount:<operatorNamespace>:<serviceAccount> and aud = sts.amazonaws.com */}}
{{- $acct := required "global.accountId is required" .Values.global.accountId -}}
{{- if not (kindIs "string" $acct) -}}
{{- fail "global.accountId must be a quoted string, for example \"123456789012\"" -}}
{{- end -}}
{{- if eq $acct "REPLACE_ME" -}}
{{- fail "set global.accountId in deployment/charts/external-secrets/config/values.yaml" -}}
{{- end -}}
{{- range .Values.stores }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .serviceAccount }}
  namespace: {{ $.Values.global.operatorNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    eks.amazonaws.com/role-arn: arn:aws:iam::{{ $acct }}:role/{{ .roleName }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .name }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ $.Values.global.region }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .serviceAccount }}
            namespace: {{ $.Values.global.operatorNamespace }}
  conditions:
    - namespaceSelector:
        matchLabels:
          {{ $.Values.global.labelDomain }}/{{ .label }}: "true"
{{- end }}
