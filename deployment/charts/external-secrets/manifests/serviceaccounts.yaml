# One IRSA service account per secret type. Each role must be allowed to read ONLY its own secret:
#   IAM policy:  secretsmanager:GetSecretValue and secretsmanager:DescribeSecret on that one secret's ARN
#   Trust policy: the cluster's OIDC provider, condition
#     sub = system:serviceaccount:external-secrets:<service account name>
#     aud = sts.amazonaws.com
# Replace <ACCOUNT_ID> and the role names with yours.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-mysql
  namespace: external-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/tt-eso-mysql
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-rabbitmq
  namespace: external-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/tt-eso-rabbitmq
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-email
  namespace: external-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/tt-eso-email
