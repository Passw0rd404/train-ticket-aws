# One store per secret type. The names are what the services use in their values.yaml
# (mysql.externalSecret.store.name, rabbitmq.externalSecret.store.name, externalSecrets.email.store.name).
# A namespace can use a store only if it carries the matching label (see namespaces.yaml),
# and the store's IRSA role can only read its own secret, so there are two locks per secret.
#
# Expected secrets in AWS Secrets Manager (JSON):
#   production/mysql               host, port, database, user, password
#   production/rabbitmq            host, user, password
#   production/notification-email  address, password
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: ts-mysql
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-central-1            # change to your region
      auth:
        jwt:
          serviceAccountRef:
            name: eso-mysql
            namespace: external-secrets
  conditions:
    - namespaceSelector:
        matchLabels:
          secrets.example.com/mysql: "true"
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: ts-rabbitmq
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-central-1            # change to your region
      auth:
        jwt:
          serviceAccountRef:
            name: eso-rabbitmq
            namespace: external-secrets
  conditions:
    - namespaceSelector:
        matchLabels:
          secrets.example.com/rabbitmq: "true"
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: ts-email
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-central-1            # change to your region
      auth:
        jwt:
          serviceAccountRef:
            name: eso-email
            namespace: external-secrets
  conditions:
    - namespaceSelector:
        matchLabels:
          secrets.example.com/email: "true"
