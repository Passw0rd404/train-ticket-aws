# Application namespaces and the labels that decide which secret stores they may use.
# Only the platform repo / Argo may change these labels. Never give app developers
# permission to edit namespaces.
# Change the label domain (secrets.example.com) to your own, here and in clustersecretstores.yaml.
apiVersion: v1
kind: Namespace
metadata:
  name: tt-mysql-rabbitmq
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    secrets.example.com/mysql: "true"
    secrets.example.com/rabbitmq: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: tt-mysql
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    secrets.example.com/mysql: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: tt-notification
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    secrets.example.com/mysql: "true"
    secrets.example.com/email: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: tt-no-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "0"
