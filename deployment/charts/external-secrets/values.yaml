# Values for the upstream External Secrets Operator chart.
#   repo:      https://charts.external-secrets.io
#   chart:     external-secrets
#   namespace: external-secrets
# The stores, service accounts and namespaces that go with it are in ./config (a small Helm chart)

installCRDs: true

# We only READ secrets from AWS into the cluster. Turn off everything else so nobody can
# push cluster secrets out to AWS or replicate secrets into other namespaces.
crds:
  createClusterExternalSecret: false
  createPushSecret: false
  createClusterPushSecret: false
processClusterExternalSecret: false
processPushSecret: false
processClusterPushSecret: false
processClusterStore: true

replicaCount: 1

# With EKS Pod Identity, attach ONE Pod Identity Association to the controller's ServiceAccount
# (external-secrets/external-secrets) with permission ONLY to sts:AssumeRole into the scoped
# store roles in config/templates/stores.yaml — so the controller itself cannot read secrets directly.
serviceAccount:
  create: true
  annotations: {}

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

webhook:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

certController:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
