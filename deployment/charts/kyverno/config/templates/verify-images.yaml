---
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-ghcr-images
spec:
  validationActions:
    - Deny
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 30
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "pods/ephemeralcontainers"]
  matchImageReferences:
    - glob: "{{ .Values.ghcrPrefix }}*"
  validationConfigurations:
    mutateDigest: true
    verifyDigest: true
    required: true
  attestors:
    - name: github-actions
      cosign:
        keyless:
          identities:
            - issuer: {{ .Values.cosign.issuer | quote }}
              subjectRegExp: {{ .Values.cosign.subjectRegExp | quote }}
        ctlog:
          url: https://rekor.sigstore.dev
  validations:
    - message: "GHCR images must carry a valid Cosign signature from train-ticket-aws build-push.yml."
      expression: >-
        images.containers.map(image, verifyImageSignatures(image, [attestors.github-actions])).all(e, e > 0) &&
        images.initContainers.map(image, verifyImageSignatures(image, [attestors.github-actions])).all(e, e > 0) &&
        images.ephemeralContainers.map(image, verifyImageSignatures(image, [attestors.github-actions])).all(e, e > 0)
