# Values for the upstream Kyverno Helm chart (3.10.0 / Kyverno v1.20.0).
#   repo:      https://kyverno.github.io/kyverno/
#   chart:     kyverno
#   namespace: kyverno
# The CEL policies live in ./config (a small Helm chart).

crds:
  install: true

config:
  preserve: false

admissionController:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

backgroundController:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 256Mi

reportsController:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 256Mi

cleanupController:
  replicas: 1
  rbac:
    clusterRole:
      extraResources:
        - apiGroups: [""]
          resources: ["pods"]
          verbs: ["get", "list", "watch", "delete"]
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 192Mi
