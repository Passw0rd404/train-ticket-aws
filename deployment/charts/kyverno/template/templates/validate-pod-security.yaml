{{- $nsList := list -}}
{{- range .Values.managedNamespaces -}}
{{- $nsList = append $nsList (printf "'%s'" .) -}}
{{- end -}}
{{- $nsCel := printf "[%s]" (join ", " $nsList) -}}
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: enforce-pod-security
spec:
  validationActions:
    - Deny
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: managed-namespaces-only
      expression: "object.metadata.namespace in {{ $nsCel }}"
  validations:
    - message: "Host namespaces (hostNetwork, hostPID, hostIPC) are forbidden."
      expression: >-
        !object.spec.?hostNetwork.orValue(false) &&
        !object.spec.?hostPID.orValue(false) &&
        !object.spec.?hostIPC.orValue(false)
    - message: "Privileged containers are forbidden."
      expression: >-
        object.spec.containers.all(c, !c.?securityContext.?privileged.orValue(false)) &&
        object.spec.?initContainers.orValue([]).all(c, !c.?securityContext.?privileged.orValue(false))
    - message: "Only approved registries/images (ghcr.io/passw0rd404/*, mysql:8.4, traefik, cloudflare/cloudflared) are allowed."
      expression: >-
        object.spec.containers.all(c,
          c.image.startsWith("{{ .Values.ghcrPrefix }}") ||
          c.image.startsWith("mysql:8.4") ||
          c.image.startsWith("docker.io/library/mysql:8.4") ||
          c.image.startsWith("traefik:") ||
          c.image.startsWith("docker.io/traefik:") ||
          c.image.startsWith("cloudflare/cloudflared:")
        )
