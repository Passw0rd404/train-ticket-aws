          image: {{ .Values.rabbitmqExporter.image | quote }}
          envFrom:
            - secretRef:
                name: monitoring-rabbitmq
          ports:
            - name: metrics
              containerPort: 9419
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-exporter
spec:
  selector:
