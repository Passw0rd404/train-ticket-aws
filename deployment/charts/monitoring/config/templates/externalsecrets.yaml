---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: monitoring-grafana
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: monitoring
  target:
    name: monitoring-grafana
    creationPolicy: Owner
  data:
    - secretKey: PROMETHEUS_URL
      remoteRef:
        key: production/grafana
        property: prometheus_url
    - secretKey: PROMETHEUS_USERNAME
      remoteRef:
        key: production/grafana
        property: prometheus_username
    - secretKey: LOKI_URL
      remoteRef:
        key: production/grafana
        property: loki_url
    - secretKey: LOKI_USERNAME
      remoteRef:
        key: production/grafana
        property: loki_username
    - secretKey: OTLP_ENDPOINT
      remoteRef:
        key: production/grafana
        property: otlp_endpoint
    - secretKey: OTLP_USERNAME
      remoteRef:
        key: production/grafana
        property: otlp_username
    - secretKey: GRAFANA_API_TOKEN
      remoteRef:
        key: production/grafana
        property: api_token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: monitoring-mysql-readonly
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: monitoring
  target:
    name: monitoring-mysql-readonly
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        my.cnf: |
          [client]
          host={{ "{{ .host }}" }}
          port={{ "{{ .port }}" }}
          user={{ "{{ .user }}" }}
          password={{ "{{ .password }}" }}
        SQLEXPORTER_DSN: "mysql://{{ "{{ .user }}" }}:{{ "{{ .password }}" }}@tcp({{ "{{ .host }}" }}:{{ "{{ .port }}" }})/{{ "{{ .database }}" }}"
  data:
    - secretKey: host
      remoteRef:
        key: production/mysql-readonly
        property: host
    - secretKey: port
      remoteRef:
        key: production/mysql-readonly
        property: port
    - secretKey: database
      remoteRef:
        key: production/mysql-readonly
        property: database
    - secretKey: user
      remoteRef:
        key: production/mysql-readonly
        property: user
    - secretKey: password
      remoteRef:
        key: production/mysql-readonly
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: monitoring-rabbitmq
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: monitoring
  target:
    name: monitoring-rabbitmq
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        RABBIT_URL: "https://{{ "{{ .host }}" }}:443"
        RABBIT_USER: "{{ "{{ .user }}" }}"
        RABBIT_PASSWORD: "{{ "{{ .password }}" }}"
  data:
    - secretKey: host
      remoteRef:
        key: production/rabbitmq
        property: host
    - secretKey: user
      remoteRef:
        key: production/rabbitmq
        property: user
    - secretKey: password
      remoteRef:
        key: production/rabbitmq
        property: password
