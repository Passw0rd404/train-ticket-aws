name: ts-ticket-office-service
port: 16108
namespace: tt-mysql

image:
  registry: ghcr.io/passw0rd404
  tag: latest

resources:
  requests:
    cpu: 100m
    memory: 300Mi
  limits:
    cpu: 500m
    memory: 2000Mi

mysql:
  enabled: true
  externalSecret:
    store:
      kind: ClusterSecretStore
      name: ts-mysql
    key: production/mysql

networkPolicy:
  enabled: true
  allowFrom:
    - name: traefik
      namespace: traefik

httpRoute:
  enabled: true
  paths:
    - value: /office

readinessProbe:
  type: http
  path: /office
livenessProbe:
  type: http
  path: /office
