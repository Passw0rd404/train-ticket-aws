name: ts-admin-travel-service
port: 16114
namespace: tt-no-secrets

image:
  registry: ghcr.io/passw0rd404
  tag: latest

env:
  SPRING_MAIN_ALLOW_CIRCULAR_REFERENCES: "true"

resources:
  requests:
    cpu: 100m
    memory: 300Mi
  limits:
    cpu: 500m
    memory: 2000Mi

networkPolicy:
  enabled: true
  allowFrom:
    - name: traefik
      namespace: traefik

httpRoute:
  enabled: true
  paths:
    - value: /api/v1/admintravelservice
