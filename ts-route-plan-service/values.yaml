name: ts-route-plan-service
port: 14578
namespace: tt-no-secrets

image:
  registry: ghcr.io/passw0rd404
  tag: latest

env:
  SPRING_MAIN_ALLOW_CIRCULAR_REFERENCES: "true"

resources:
  requests:
    cpu: 100m
    memory: 300Mi
  limits:
    cpu: 500m
    memory: 2000Mi

networkPolicy:
  enabled: true
  allowFrom:
    - name: traefik
      namespace: traefik
    - name: ts-travel-plan-service
      namespace: tt-no-secrets

httpRoute:
  enabled: true
  paths:
    - value: /api/v1/routeplanservice
