name: ts-food-service
port: 18856
namespace: tt-mysql-rabbitmq

image:
  registry: ghcr.io/passw0rd404
  tag: latest

env:
  SPRING_MAIN_ALLOW_CIRCULAR_REFERENCES: "true"
  SPRING_RABBITMQ_PORT: "5671"
  SPRING_RABBITMQ_SSL_ENABLED: "true"

resources:
  requests:
    cpu: 100m
    memory: 300Mi
  limits:
    cpu: 500m
    memory: 2000Mi

mysql:
  enabled: true
  externalSecret:
    store:
      kind: ClusterSecretStore
      name: ts-mysql
    key: production/mysql

rabbitmq:
  enabled: true
  externalSecret:
    store:
      kind: ClusterSecretStore
      name: ts-rabbitmq
    key: production/rabbitmq

networkPolicy:
  enabled: true
  allowFrom:
    - name: ts-gateway-service
      namespace: tt-no-secrets
    - name: ts-preserve-other-service
      namespace: tt-no-secrets
    - name: ts-preserve-service
      namespace: tt-no-secrets
