name: ts-avatar-service
port: 17001
namespace: tt-no-secrets

image:
  registry: ghcr.io/passw0rd404
  tag: latest

resources:
  requests:
    cpu: 100m
    memory: 300Mi
  limits:
    cpu: 500m
    memory: 2000Mi

networkPolicy:
  enabled: true
  allowFrom:
    - name: traefik
      namespace: traefik

httpRoute:
  enabled: true
  paths:
    - value: /api/v1/avatar
