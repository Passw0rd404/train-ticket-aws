name: ts-consign-price-service
port: 16110
namespace: tt-mysql

image:
  registry: ghcr.io/passw0rd404
  tag: sha-2b2f880

env:
  SPRING_MAIN_ALLOW_CIRCULAR_REFERENCES: "true"

resources:
  requests:
    cpu: 100m
    memory: 300Mi
  limits:
    cpu: 500m
    memory: 2000Mi

mysql:
  enabled: true
  externalSecret:
    store:
      kind: ClusterSecretStore
      name: ts-mysql
    key: production/mysql

networkPolicy:
  enabled: true
  allowFrom:
    - name: ts-consign-service
      namespace: tt-mysql
    - name: traefik
      namespace: traefik

httpRoute:
  enabled: true
  paths:
    - value: /api/v1/consignpriceservice
