name: ts-voucher-service
port: 16101
namespace: tt-mysql

image:
  registry: ghcr.io/passw0rd404
  tag: sha-2b2f880

resources:
  requests:
    cpu: 100m
    memory: 300Mi
  limits:
    cpu: 500m
    memory: 2000Mi

mysql:
  enabled: true
  externalSecret:
    store:
      kind: ClusterSecretStore
      name: ts-mysql
    key: production/mysql

networkPolicy:
  enabled: true
  allowFrom:
    - name: traefik
      namespace: traefik

httpRoute:
  enabled: true
  paths:
    - value: /getVoucher

readinessProbe:
  type: tcp
livenessProbe:
  type: tcp
